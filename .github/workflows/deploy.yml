name: Deploy Laravel to VPS

on:
  push:
    branches:
      - main
  # Cho chạy tay từ tab Actions.
  #
  # Lý do thêm: sau khi xoay khóa deploy (01/10/2026) không có cách nào kiểm
  # khóa mới có chạy được hay không mà không đẩy một commit vào `main` — tức
  # lần đầu đường deploy được thử lại chính là lần deploy thật. Lần xoay khóa
  # sau không nên như vậy.
  #
  # GitHub chỉ hiện `workflow_dispatch` khi file này đã nằm trên nhánh mặc
  # định, nên nó chỉ dùng được SAU khi merge.
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # Chạy lại đúng bộ test trên chính SHA sắp deploy. Trước đây deploy không hề
  # chạy test — code lên thẳng production (audit F-17).
  #
  # ══ Từ 09/11/2026 đây là lượt test DUY NHẤT của một push vào `main` ══
  #
  # `tests.yml` không còn khai `main` trong `on.push.branches` — trước đó một
  # push kích hai lượt chạy cùng bộ test cho cùng một SHA, và hai lượt `npm ci`
  # song song tranh cache của nhau. Lý do đầy đủ nằm ở đầu `tests.yml`.
  #
  # Nên gỡ dòng `uses:` dưới đây là trả `main` về đúng tình trạng audit F-17:
  # code lên production mà không bộ test nào chạy trên SHA đó.
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest

    # ══ CHỐT DUYỆT TAY ══════════════════════════════════════════════════
    #
    # `environment:` không phải một cái nhãn. Nó buộc GitHub dừng job này ở
    # trạng thái "Waiting" và đợi một người trong danh sách người duyệt của
    # environment `production` bấm "Approve and deploy" trên tab Actions.
    # Job `tests` ở trên KHÔNG khai dòng này, nên bộ test vẫn chạy ngay sau
    # mỗi push vào `main` — chỉ bước SSH vào máy chủ phải đợi.
    #
    # Vì sao cần: đến 07/11/2026 thì merge một PR vào `main` là deploy
    # production ngay, không có bước nào ở giữa. Một lần bấm nhầm nút merge
    # trên giao diện GitHub — hoặc một `gh pr merge` gõ sai số — đẩy
    # `php artisan down` lên trang thật trong vòng ba phút. Chốt này biến
    # cái nhầm đó thành một job đứng đợi, hiện rõ trên tab Actions, huỷ được
    # bằng một nút.
    #
    # Hai thứ cấu hình ở phía GitHub, không nằm trong tệp này (xem
    # `docs/deploy/CHOT-DUYET-DEPLOY.md` để dựng lại):
    #
    #   - người duyệt bắt buộc: `tuanna0703`;
    #   - chính sách nhánh: chỉ `main` được deploy vào environment này, nên
    #     thêm một nhánh khác vào trigger ở trên cũng không mở được đường
    #     deploy production — GitHub từ chối ở lớp environment.
    #
    # `prevent_self_review` để FALSE có chủ ý: dự án hiện có đúng một người
    # có quyền. Bật nó lên thì người merge không tự duyệt được, và vì không
    # có người thứ hai, đường deploy production bị khoá cứng.
    #
    # ══ Cái chốt này KHÔNG bảo vệ ══
    #
    # `workflow_dispatch` ở trên cũng đi qua job này, nên chạy tay cũng phải
    # đợi duyệt. Nhưng người có quyền admin repo vẫn xoá được environment
    # hoặc tự thêm mình vào danh sách duyệt. Đây là chốt chống NHẦM, không
    # phải chốt chống người cố ý.
    environment: production

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Khóa nền bản đồ. Nguồn là GitHub Secrets; `deploy.sh` đồng bộ nó
          # vào `.env` trên máy chủ ở bước 3b, trước `config:cache`.
          #
          # Secret chưa đặt thì biến rỗng, `deploy.sh` bỏ qua, và mười hai bản
          # đồ chạy Esri — không khóa, nhãn tiếng Việt, vẫn là một bản đồ.
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          MAPTILER_STYLE: ${{ secrets.MAPTILER_STYLE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # `envs` là danh sách TÊN biến được mang sang phiên SSH. Thiếu dòng
          # này thì `env:` ở trên chỉ sống trong runner của GitHub và máy chủ
          # không thấy gì — deploy vẫn xanh, khóa vẫn không tới nơi.
          envs: MAPTILER_KEY,MAPTILER_STYLE
          script_stop: true
          script: |
            set -e
            cd /www/wwwroot/dash.oohx.net
            bash deploy.sh
