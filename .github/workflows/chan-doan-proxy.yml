name: Chẩn đoán proxy OpenLiteSpeed

# CHỈ chạy tay, CHỈ đọc.
#
# ══ Vì sao cần một workflow riêng cho việc này ══
#
# Bước `[11/11]` của `deploy.sh` in ra:
#
#     Bỏ qua: /www/server/panel/vhost/openlitespeed/proxy/oohx.net chưa tồn tại
#
# nhưng `/explore`, `/owners`, `/products` vẫn đang chạy trên Next. Nghĩa là có
# một file cấu hình proxy ở CHỖ KHÁC, dán tay, và không ai biết nó ở đâu. Mọi
# thay đổi `nextjs.conf` trong repo vì thế không tới máy chủ — đó là lý do
# `/map` vẫn là Laravel từ PR #11 dù conf đã khai nó.
#
# Bước tiếp theo (dán conf repo vào đúng thư mục) có một cách sai nguy hiểm:
# giữ cả hai file thì HAI file cùng khai `extprocessor nextjs`, OpenLiteSpeed
# nạp song song và hành vi không đoán được — có thể làm `/explore` chết, không
# chỉ là không mở được trang mới. Nên phải biết file cũ ở đâu TRƯỚC khi dán.
#
# ══ Vì sao không gộp vào deploy.sh ══
#
# `deploy.sh` chạy trên mọi lần merge vào `main`. Một bước chẩn đoán in mười
# khối văn bản ở đó sẽ bị trôi trong log và không ai đọc. Và việc này cần làm
# một lần, không phải mỗi lần deploy.
#
# ══ Không có lệnh nào đổi gì ══
#
# Toàn bộ là `ls`, `grep`, `stat`, `sudo -n -l`. Không `cp`, không `mv`, không
# `rm`, không `restart`. Chạy nó nhiều lần cũng vô hại.
#
# ══ `set +e`, và vì sao bản đầu thiếu nó là một lỗi thật ══
#
# Bản đầu chỉ dựa vào `|| true` ở từng lệnh, và nó **không đủ**: lần chạy
# 37471490002 chết ở khối 4, nên khối 5 (service Next.js) và khối 6 (conf repo
# khai gì) không bao giờ in ra. Một phép chẩn đoán dừng giữa đường thì tệ hơn
# là không có — nó trả lời nửa câu rồi báo "failure", và người đọc không biết
# nửa sau im lặng vì không có vấn đề hay vì script đã chết.
#
# `script_stop: true` của action thêm `set -e`. Với một script CHỈ ĐỌC thì
# `set -e` là sai hướng: mọi lệnh ở đây đều có thể trả khác 0 một cách hợp lệ
# (`grep` không khớp, `stat` không có quyền, `systemctl` không biết unit), và
# mỗi cái đó là một KẾT QUẢ, không phải một sự cố. Nên tắt `set -e` cho phần
# thân.
#
# Giữ `script_stop: true` vì nó vẫn còn tác dụng ở tầng ngoài: lỗi kết nối SSH
# hay lỗi xác thực vẫn làm job đỏ, và đó mới là thứ đáng đỏ.

on:
  workflow_dispatch:

jobs:
  chan-doan:
    runs-on: ubuntu-latest

    steps:
      - name: Đọc trạng thái proxy trên VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            # Xem khối ghi chú đầu file: mọi lệnh dưới đây có thể trả khác 0
            # một cách hợp lệ, và mỗi cái là một kết quả cần in ra.
            set +e

            echo "════ 1. CI đăng nhập bằng user nào, và có quyền sudo gì ════"
            echo "user: $(whoami)"
            echo
            echo "-- Quyền sudo không mật khẩu đang có --"
            echo "   (đây là câu trả lời cho 'cần cấp thêm dòng nào'.)"
            sudo -n -l 2>&1 || echo "   sudo -n -l không chạy được — có thể chưa có grant nào, hoặc sudoers chặn cả -l"

            echo
            echo "════ 2. Conf nào đang thật sự phục vụ Next.js ════"
            echo "   Tìm theo cổng 3001 chứ không theo tên file: file có thể tên gì cũng được."
            echo
            echo "-- Thử với quyền thường --"
            grep -rl "127.0.0.1:3001" \
                /www/server/panel/vhost/openlitespeed/ \
                /usr/local/lsws/conf/ 2>&1 | sed 's/^/   /'

            # Lần chạy 37471490002 cho "Permission denied" trên thư mục panel:
            # cấu hình OpenLiteSpeed là root-only với user này. Nên "không tìm
            # thấy" ở trên KHÔNG có nghĩa là conf không tồn tại — nó có nghĩa
            # là không đọc được. Phân biệt hai thứ đó là việc của khối này.
            echo
            echo "-- Thử lại với sudo (để phân biệt 'không có' với 'không đọc được') --"
            sudo -n grep -rl "127.0.0.1:3001" \
                /www/server/panel/vhost/openlitespeed/ \
                /usr/local/lsws/conf/ 2>&1 | sed 's/^/   /'
            echo "   (dòng 'a password is required' nghĩa là CHƯA có quyền sudo cho lệnh này —"
            echo "    đó là kết quả cần biết, không phải sự cố.)"

            echo
            echo "-- Những context từng file đó khai --"
            FILES=$(grep -rl "127.0.0.1:3001" \
                        /www/server/panel/vhost/openlitespeed/ \
                        /usr/local/lsws/conf/ 2>/dev/null)
            if [ -z "$FILES" ]; then
                echo "   (không có file nào đọc được — xem hai khối trên)"
            fi
            for f in $FILES; do
                echo "   ┌─ $f"
                grep -nE "^[[:space:]]*(extprocessor|context)" "$f" 2>&1 | sed 's/^/   │ /'
                echo "   └─"
            done

            echo
            echo "════ 3. Vhost có nạp thư mục deploy.sh trông vào không ════"
            echo "   Không có dòng include này thì dán conf vào đó là vô nghĩa."
            grep -n "proxy/oohx.net" \
                /www/server/panel/vhost/openlitespeed/detail/oohx.net.conf 2>&1 \
                || echo "   KHÔNG có dòng include — phải thêm vào detail/oohx.net.conf trước"

            echo
            echo "-- Mọi dòng include của vhost --"
            grep -nE "^[[:space:]]*include" \
                /www/server/panel/vhost/openlitespeed/detail/oohx.net.conf 2>&1 \
                || echo "   (không đọc được hoặc không có)"

            echo
            echo "════ 4. Quyền đọc/ghi của những thư mục liên quan ════"
            echo "   Nếu mục 2 và 3 trống, rất có thể là do quyền, không phải do không tồn tại."
            for d in /www/server/panel/vhost/openlitespeed \
                     /www/server/panel/vhost/openlitespeed/detail \
                     /www/server/panel/vhost/openlitespeed/proxy \
                     /www/server/panel/vhost/openlitespeed/proxy/oohx.net; do
                if [ -e "$d" ]; then
                    echo "   $(stat -c '%A %U:%G' "$d" 2>/dev/null)  $d"
                else
                    echo "   (chưa tồn tại)            $d"
                fi
            done

            echo
            echo "════ 5. Service Next.js ════"
            systemctl is-active oohx-webapp 2>&1 | sed 's/^/   is-active: /' || true
            curl -s -o /dev/null -w "   cuc bo :3001/explore -> %{http_code}\n" \
                http://127.0.0.1:3001/explore || true
            curl -s -o /dev/null -w "   cuc bo :3001/bang-phi -> %{http_code}\n" \
                http://127.0.0.1:3001/bang-phi || true

            echo
            echo "════ 6. conf trong repo đang khai gì ════"
            echo "   Đây là trạng thái MONG MUỐN. So với mục 2 để thấy lệch ở đâu."
            grep -nE "^context " \
                /www/wwwroot/dash.oohx.net/docs/deploy/nextjs-proxy/nextjs.conf \
                | sed 's/^/   /' || true

            echo
            echo "════ HẾT ════"
