name: Tests

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  # Cho deploy.yml gọi lại đúng workflow này, để deploy chỉ chạy sau khi test xanh
  # TRÊN ĐÚNG SHA sắp deploy. `needs:` không nối được hai workflow khác file.
  workflow_call:

# Chạy trên MySQL, KHÔNG dùng SQLite: nhiều migration của dự án dùng cú pháp
# riêng của MySQL (SHOW INDEX, UPDATE ... JOIN, ALTER TABLE ... PARTITION BY),
# nên bộ test không dựng nổi schema trên SQLite.
jobs:
  # Ba script shell có quyền rất rộng trên production: `deploy.sh` và
  # `rollback.sh` thay được toàn bộ mã nguồn và chạy migration, còn
  # `oohx-sync-proxy.sh` chạy AS ROOT và đổi được cấu hình web server. Chúng
  # không có test nào canh, và năm lỗi trong chúng đều tìm ra bằng đọc mắt chứ
  # không bằng CI.
  #
  # Job này canh ba thứ: cú pháp, lỗi backtick đã xảy ra hai lần, và — cho
  # script root — danh sách trắng của nó, vì đó là thứ duy nhất ngăn một conf
  # độc hại được dán vào cấu hình web server.
  shell:
    name: Script deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cú pháp bash
        run: |
          for f in deploy.sh rollback.sh \
                   docs/deploy/nextjs-proxy/oohx-sync-proxy.sh \
                   tests/shell/thu-kiem-conf.sh; do
            bash -n "$f" && echo "OK  $f"
          done

      - name: Backtick trong chuỗi nháy đôi
        # `bash -n` KHÔNG bắt được lỗi này: cú pháp hợp lệ, nhưng bash coi phần
        # trong backtick là lệnh cần chạy. Ngày 03/10/2026 tôi viết
        #     echo "  `git reset --hard` xoá file ..."
        # có ý trích dẫn tên lệnh, và nó sẽ CHẠY `git reset --hard` thật — ngay
        # trong khối đang báo người dùng ĐỪNG lùi. Lần thứ hai cùng một lỗi
        # trong cùng một file, nên nó thành phép kiểm thay vì một lời nhắc.
        run: |
          if grep -nE '^[^#]*"[^"]*`' deploy.sh rollback.sh \
                 docs/deploy/nextjs-proxy/oohx-sync-proxy.sh; then
            echo ""
            echo "LỖI: backtick trong chuỗi nháy đôi ở các dòng trên."
            echo "     Bash sẽ chạy phần trong backtick như một lệnh."
            echo "     Muốn in ra chữ thì bỏ backtick, hoặc dùng nháy đơn."
            exit 1
          fi
          echo "OK  không có backtick trong chuỗi nháy đôi"

      # Danh sách trắng của script root là thứ DUY NHẤT ngăn một conf độc hại
      # được dán vào cấu hình web server.
      #
      # `oohx-sync-proxy.sh` đọc conf từ cây mã nguồn, mà cây đó user deploy
      # ghi được. Nên "ai merge được vào main thì ảnh hưởng được cấu hình web
      # server" — và cái chặn duy nhất là hàm `kiem_conf`.
      #
      # Bộ thử này trích đúng hàm đó ra khỏi script thật (không chép lại, vì
      # chép lại là thử một bản khác) rồi chạy 41 trường hợp: địa chỉ trỏ ra
      # ngoài máy, `context /`, nhóm cấm, và — quan trọng nhất — những đường
      # là TIỀN TỐ của nhóm cấm. Chiều cuối là một lỗ thật của bản đầu:
      # `context /ap` không trùng dòng nào trong danh sách cấm, nhưng
      # OpenLiteSpeed khớp theo tiền tố nên nó nuốt `/api/v1`.
      - name: Phép kiểm cho script root
        run: bash tests/shell/thu-kiem-conf.sh

  # Trang công khai trên Next.js (giai đoạn 6).
  #
  # Job này là phép kiểm DUY NHẤT cho app đó, và nó kiểm đúng thứ đáng kiểm:
  # `webapp/lib/api.ts` lấy mọi kiểu dữ liệu từ
  # `resources/js/types/api-v2.d.ts`, sinh từ `docs/openapi/v2.yaml`. Nên đổi
  # đặc tả mà quên đổi code gọi API thì `next build` đỏ ở đây — không phải chờ
  # tới lúc ai đó mở trang.
  #
  # Chạy `types:api` trước khi build, có chủ ý: nếu file kiểu đã commit trôi
  # khỏi đặc tả thì build sẽ dùng bản SINH LẠI, nên lỗi lộ ra ngay. Chốt chống
  # trôi của chính file kiểm đó nằm ở `types:api:check`, chạy riêng bên dưới.
  webapp:
    name: Next.js (trang công khai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sinh lại kiểu từ OpenAPI
        run: |
          npm ci
          npm run types:api

      - name: Kiểu đã commit không được trôi khỏi đặc tả
        run: git diff --exit-code -- resources/js/types/api-v2.d.ts

      # Build với API GIẢ, không với API production.
      #
      # Trước đây bước này không khai `OOHX_API_BASE`, nên nó dùng mặc định
      # `https://oohx.net/api/v2` — tức **CI gọi vào production**. Hai hệ quả:
      # build lấy dữ liệu khác nhau mỗi lần chạy (và trang chủ prerender tĩnh
      # nên dữ liệu đó bị nướng vào HTML), và không test được một trường hợp dữ
      # liệu cụ thể nếu kho thật không có nó.
      #
      # `webapp/test/stub-api.mjs` dựng dữ liệu của chính nó, gồm cả hai
      # trường hợp đối nghịch mà phép kiểm SEO cần: một màn hình CÓ giá và một
      # màn hình KHÔNG có giá.
      - name: Build với API giả
        working-directory: webapp
        run: |
          npm ci
          node -e "import('./test/stub-api.mjs').then(async ({startStubApi})=>{await startStubApi(4998);setInterval(()=>{},1000)})" &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4998/api/v2/stats && break || sleep 1; done
          OOHX_API_BASE=http://127.0.0.1:4998/api/v2 OOHX_PUBLIC_ORIGIN=https://oohx.net npm run build

      # Phép kiểm SEO cho các trang Next, đo trên HTML ĐÃ RENDER.
      #
      # Vì sao không unit-test `buildMetadata()`: lỗi SEO thật duy nhất của
      # giai đoạn 6 là `metadata.other` phát `<meta name="og:type">` thay vì
      # `property=`. Object trả về đúng; chỗ sai nằm ở cách Next render nó.
      # Một unit test so object sẽ xanh. Và `next build` cũng xanh — đã thử.
      #
      # Vì sao lớp này cần tồn tại: `SeoBaselineTest` canh `/`, `/explore`,
      # `/owners`, `/products`, `/map`, nhưng bốn trong năm đường đó giờ do
      # Next phục vụ trên production. Test đó vẫn xanh vì PHPUnit gọi vào
      # Laravel — nó canh những trang người dùng KHÔNG CÒN THẤY.
      - name: Thẻ SEO trên HTML đã render
        working-directory: webapp
        run: npm run test:seo

  # Phần JS của hai trang Blade đọc `/api/v2` từ trình duyệt: `/cart` và
  # `/booking/{campaign}/payment`.
  #
  # Vì sao tách job riêng, không gộp vào `webapp`: mã dưới test nằm trong
  # `resources/views`, không trong `webapp/`. Gộp vào một job tên "Next.js
  # (trang công khai)" là đặt sai tên cho thứ nó đang canh, và khi job đó đỏ thì
  # người đọc đi tìm sai chỗ.
  #
  # Vì sao job này cần tồn tại: sau khi hai trang chuyển sang đọc API, phía máy
  # chủ còn 32 ca PHPUnit canh API và canh "trang không render sẵn số tiền" —
  # nhưng phần JS *vẽ* thì không có gì canh. Ba lỗi thật của hai trang đó
  # (`chu()` không thoát dấu nháy kép, `new Date()` làm lùi ngày theo lịch, 401
  # xử lý bằng `location.reload()`) đều KHÔNG làm đỏ một test PHPUnit nào.
  bladejs:
    name: JS của trang Blade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      # Test trích đúng khối <script> sẽ lên production ra khỏi tệp .blade.php
      # rồi chạy nó trong jsdom, nên nó canh mã thật chứ không canh một bản
      # sao. Chi tiết và giới hạn ở tests/js/README.md.
      - name: Chạy test JS
        run: npm run test:js

  phpunit:
    name: PHPUnit (MySQL 8)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-secret
          MYSQL_DATABASE: oohx_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -pci-secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Cài PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath, gd, intl, zip
          coverage: none

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      # Tài nguyên frontend phải build trước khi chạy test: public/build không
      # theo repo, mà mọi trang Blade đều gọi @vite() — thiếu manifest thì hàng
      # chục test render trang hỏng vì lý do không liên quan gì tới nội dung test.
      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      # Kiểu TypeScript sinh từ OpenAPI phải khớp đặc tả.
      #
      # `CLAUDE.md` mục 2: "OpenAPI là nguồn sự thật cho kiểu dữ liệu; Next.js
      # sinh TypeScript từ đó, không chép tay." Nhưng một file sinh ra mà không
      # ai kiểm thì sẽ lệch: sửa đặc tả rồi quên chạy lại, và bên tiêu thụ dùng
      # kiểu cũ mà không có gì báo.
      #
      # Bước này sinh lại rồi so với bản đã commit. Lệch là đỏ, kèm hướng dẫn.
      - name: Kiểu TypeScript còn khớp OpenAPI
        run: |
          npm run types:api
          if ! git diff --exit-code -- resources/js/types/api-v2.d.ts; then
            echo ""
            echo "Kiểu TypeScript đã lệch khỏi docs/openapi/v2.yaml."
            echo "Chạy: npm run types:api  rồi commit file sinh ra."
            exit 1
          fi

      # Bước chặn: dừng ngay nếu biến CSDL không trỏ tới DB test dùng một lần.
      # .env của dự án trỏ vào production, nên một cấu hình sai ở đây là mất dữ liệu thật.
      - name: Kiểm tra an toàn trước khi chạy test
        run: |
          test "${DB_DATABASE}" = "oohx_ci" || { echo "DB_DATABASE phải là oohx_ci"; exit 1; }
          test "${DB_HOST}" = "127.0.0.1"  || { echo "DB_HOST phải là 127.0.0.1"; exit 1; }
          test ! -f bootstrap/cache/config.php || { echo "Tồn tại config cache"; exit 1; }
          test ! -f .env || { echo ".env không được có mặt trong CI"; exit 1; }
        env:
          DB_DATABASE: oohx_ci
          DB_HOST: 127.0.0.1

      # Chạy TOÀN BỘ, không loại nhóm nào. Cờ --exclude-group
      # f12-network-relation đã được gỡ ở giai đoạn 3 cùng lúc với việc hợp
      # nhất quan hệ Màn hình ↔ Mạng lưới.
      - name: Chạy test
        # `--display-warnings` và `--display-deprecations`: in NGUYÊN VĂN cảnh
        # báo thay vì chỉ một dòng bị cắt theo bề rộng terminal.
        #
        # Lý do thêm: 610/619 test đang ở trạng thái WARN với cùng một cảnh báo
        # `file_get_contents(…)` bị cắt ngắn, nên không truy được nguồn. Một bộ
        # test mà 98% là WARN thì cảnh báo mới nào cũng chìm — và chìm thì nó
        # không còn là cảnh báo.
        run: php artisan test --log-junit storage/logs/junit.xml --display-warnings --display-deprecations --display-notices
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: http://oohx.test
          FRONTPAGE_DOMAIN: oohx.test
          DASH_DOMAIN: dash.oohx.test
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: oohx_ci
          DB_USERNAME: root
          DB_PASSWORD: ci-secret
          DB_URL: ''
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

      - name: Lưu kết quả test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.sha }}
          path: storage/logs/junit.xml
