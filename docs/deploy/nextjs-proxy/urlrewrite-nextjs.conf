# Luật viết lại URL cho những đường Next.js phục vụ mà KHÔNG mở được bằng
# `context`.
#
# Đặt tại: /www/server/panel/vhost/openlitespeed/proxy/oohx.net/urlrewrite/nextjs.conf
# Đồng bộ tự động bởi `oohx-sync-proxy`. Đừng sửa tay trên máy chủ.
#
# ══ Vì sao trang chủ phải đi đường này ══
#
# OpenLiteSpeed khớp `context` theo TIỀN TỐ, nên `context /` là một luật bắt
# tất cả: nó nuốt `/api/v1` (hợp đồng với đối tác), `/cart`, `/sitemap.xml`,
# `/livewire`, và mọi đường chưa ai nghĩ tới. Cách duy nhất để dùng nó là liệt
# kê đủ đường Laravel bằng context dài hơn — và "liệt kê đủ" là thứ không ai
# bảo đảm được.
#
# Trang chủ thì là MỘT đường dẫn chính xác. Một luật neo hai đầu `^/?$` khớp
# đúng nó và không khớp gì khác. Không phải "an toàn hơn" — nó là một loại
# luật khác.
#
# ══ Vì sao file này nằm trong `rewrite { }` ══
#
# `detail/oohx.net.conf` có:
#
#     rewrite  {
#       enable                  1
#       autoLoadHtaccess        1
#       include .../proxy/oohx.net/urlrewrite/*.conf   ← file này
#       ...
#     }
#
# Nên nội dung ở đây là directive rewrite TRẦN — không bọc `rewrite { }`, vì
# nó đã nằm trong một khối rewrite rồi. Bọc thêm một lớp là lỗi cú pháp, và
# OpenLiteSpeed hỏng cả khối chứ không chỉ bỏ qua một dòng.
#
# `autoLoadHtaccess 1` nghĩa là `.htaccess` của Laravel cũng được nạp — luật
# front controller đẩy mọi thứ về `index.php`. Luật dưới đây đứng TRƯỚC (include
# này là include đầu trong khối) và `[P]` kết thúc xử lý, nên `/` không bao giờ
# tới được Laravel.
#
# ══ `http://nextjs/` là TÊN external app, không phải tên miền ══
#
# LiteSpeed phân giải `nextjs` thành `extprocessor nextjs` khai trong
# `nextjs.conf` cùng thư mục cha — tức `127.0.0.1:3001`. Viết thẳng địa chỉ IP
# ở đây cũng chạy, nhưng khi ấy cổng bị khai hai nơi và hai nơi sẽ trôi khỏi
# nhau.

RewriteRule ^/?$ http://nextjs/ [P]
