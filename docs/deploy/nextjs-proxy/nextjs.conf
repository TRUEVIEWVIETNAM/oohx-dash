# Proxy OpenLiteSpeed → Next.js cho trang công khai (giai đoạn 6).
#
# Đặt tại: /www/server/panel/vhost/openlitespeed/proxy/oohx.net/nextjs.conf
#
# ══ Vì sao đặt ở ĐÚNG thư mục này ══
#
# `detail/oohx.net.conf` là file do aaPanel SINH RA. Sửa tay vào đó thì panel
# ghi đè khi bạn đổi cài đặt site trong giao diện, và định tuyến Next.js biến
# mất không báo gì — `/explore` lặng lẽ quay về Laravel mà không ai thấy.
#
# Nhưng chính file đó có sẵn dòng:
#     include /www/server/panel/vhost/openlitespeed/proxy/oohx.net/*.conf
# nên một file riêng trong thư mục đó được nạp mà không bị panel chạm tới.
#
# ══ Hai context, không phải một ══
#
# `/_next` là bắt buộc. Next.js phục vụ JS/CSS của chính nó dưới đường dẫn đó;
# thiếu context này thì OpenLiteSpeed đi tìm file trên đĩa dưới
# `/www/wwwroot/dash.oohx.net/public/_next` — không có — và trang Next.js hiện
# ra không CSS, không JS, trông như trang hỏng chứ không như trang chưa cấu
# hình đủ.

extprocessor nextjs {
  type                    proxy
  address                 127.0.0.1:3001
  maxConns                100
  initTimeout             60
  # retryTimeout 0: Next.js chết thì trả lỗi ngay thay vì giữ request chờ.
  # Giữ chờ là cách biến một tiến trình chết thành một trang treo 100 giây.
  retryTimeout            0
  respBuffer              0
}

# ── Đường dẫn đã chuyển sang Next.js ────────────────────────────────────────
#
# MỞ TỪNG ĐƯỜNG MỘT. Thêm cả nhóm cùng lúc thì khi có lỗi không biết đường nào
# gây ra. Thứ tự khuyến nghị trong README.md cùng thư mục này.

context /_next {
  type                    proxy
  handler                 nextjs
  addDefaultCharset       off
}

# ── Tám đường đã mở, tất cả đang chạy trên production ───────────────────────
#
# Từ 06/10/2026 file này KHÔNG còn phải dán tay: `deploy.sh` bước [11/11] gọi
# `/usr/local/sbin/oohx-sync-proxy` (chạy as root) và script đó kiểm, dán, nạp
# lại, canary, tự lùi khi đỏ. Đổi context ở đây rồi merge là đủ.
#
# Thứ tự mở trước đây — mở một đường, kiểm từ ngoài, rồi mới mở tiếp — vẫn là
# cách đúng cho một đường MỚI. Nhưng giờ phép canary của script làm phần kiểm
# đó tự động, và nó kiểm chặt hơn người: mỗi context đã khai phải ra 200 VÀ
# đến từ Next.js, không chỉ 200.
context /explore {
  type                    proxy
  handler                 nextjs
  addDefaultCharset       off
}

context /owners {
  type                    proxy
  handler                 nextjs
  addDefaultCharset       off
}

context /products {
  type                    proxy
  handler                 nextjs
  addDefaultCharset       off
}

context /map {
  type                    proxy
  handler                 nextjs
  addDefaultCharset       off
}

# ── Bốn trang chính sách ────────────────────────────────────────────────────
#
# Trang Next đã có (`webapp/app/(chinh-sach)/[slug]/page.tsx`) và lấy phần thân
# từ `GET /api/v2/policies/{slug}`, mà endpoint đó render đúng partial Blade
# trang Laravel render — nên hai bên không thể hiện ra chữ khác nhau.
#
# Mở nhóm này là quyết định khác hẳn mở `/explore`: đây là văn bản pháp lý được
# đóng dấu phiên bản vào từng bản ghi đồng ý của người dùng, nên nó được mở theo
# một lần duyệt riêng, không đi kèm một nhóm khác.
#
# Bốn context dưới đây là tiền tố ĐẦY ĐỦ của bốn slug, không phải tiền tố của
# nhóm nào khác — không có đường dẫn công khai nào bắt đầu bằng
# `/bang-phi...` hay `/quy-che-hoat-dong...` ngoài chính chúng. Nên mở chúng
# không nuốt thêm gì, khác hẳn `context /`.

context /quy-che-hoat-dong {
  type                    proxy
  handler                 nextjs
  addDefaultCharset       off
}

context /chinh-sach-bao-mat {
  type                    proxy
  handler                 nextjs
  addDefaultCharset       off
}

context /giai-quyet-tranh-chap {
  type                    proxy
  handler                 nextjs
  addDefaultCharset       off
}

context /bang-phi {
  type                    proxy
  handler                 nextjs
  addDefaultCharset       off
}

# ── Hai trang phản ánh của tổ chức xã hội ───────────────────────────────────
#
# Một context phủ cả hai: OpenLiteSpeed khớp tiền tố, nên
# `/phan-anh-to-chuc-xa-hoi/danh-sach` cũng thuộc nó.
#
# Trang gửi có biểu mẫu POST sang `/api/v2/reflections` — tức sang Laravel,
# cùng gốc. Nên context này KHÔNG được chạm tới `/api`, và nó không chạm:
# hai đường dẫn không có tiền tố chung.

context /phan-anh-to-chuc-xa-hoi {
  type                    proxy
  handler                 nextjs
  addDefaultCharset       off
}

# ── Đăng nhập và đăng ký ────────────────────────────────────────────────────
#
# Hai context này nuốt cả POST tới cùng đường dẫn, tức route POST /login và
# POST /register của Blade không còn với tới được. Đó là chủ ý: biểu mẫu bản
# Next gửi sang /api/v2/auth/*, và /api không bao giờ được proxy.
#
# /logout thì KHÔNG mở: nó là POST từ khu người mua trên Blade, và khu đó vẫn
# là Blade (giai đoạn 8 đang hoãn).

context /login {
  type                    proxy
  handler                 nextjs
  addDefaultCharset       off
}

context /register {
  type                    proxy
  handler                 nextjs
  addDefaultCharset       off
}

# ── KHÔNG BAO GIỜ proxy những đường dẫn này ─────────────────────────────────
#
# /api/*        — hợp đồng với đối tác (v1) và nguồn dữ liệu của chính Next.js
# /my/*         — khu người mua, giai đoạn 8 đang hoãn
# /cart, /booking/* — đường tiền, còn ở Blade
# /livewire/*   — Filament cần nó
# /sitemap.xml, /robots.txt — do Laravel sinh, và mốc SEO đang canh chúng
#
# Không khai context cho chúng là đủ: thiếu context thì OpenLiteSpeed xử lý
# bằng luật mặc định của vhost, tức Laravel. Danh sách trên là để người đọc
# biết đây là chủ ý, không phải bỏ sót.
#
# ══ Và KHÔNG MỞ `context /` ══
#
# OpenLiteSpeed khớp context theo TIỀN TỐ, nên `context /` là một luật bắt tất
# cả: nó sẽ nuốt `/api/v1`, `/cart`, `/sitemap.xml` và bốn slug chính sách.
#
# Trang chủ ĐÃ lên Next từ 07/10/2026, nhưng bằng đường khác: một luật khớp
# ĐÚNG một đường dẫn ở `urlrewrite-nextjs.conf`, nạp từ trong khối
# `rewrite { }` của vhost. `^/?$` khớp đúng `/` và không khớp gì khác, nên nó
# không cần liệt kê đường Laravel nào.
