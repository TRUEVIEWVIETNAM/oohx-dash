# Chặn `dev.oohx.net` khỏi Google — bước 4 của lát 4 (PLAN-MOI-TRUONG-DEV).
#
# Tệp này KHÔNG được script nào đọc. Nó là chỗ giữ nguyên văn hai khối cấu
# hình mà người gõ dán vào hai nơi khác nhau, để lần sau không ai phải nhớ lại.
#
# ══════════════════════════════════════════════════════════════════════════
# Vì sao không phải `public/robots.txt`
# ══════════════════════════════════════════════════════════════════════════
#
# `deploy.sh:247` chạy `git reset --hard origin/$BRANCH`. Tệp `robots.txt` được
# git theo dõi, nên mọi sửa tay trên máy chủ sẽ bị xoá ở lượt deploy kế tiếp —
# im lặng, không báo gì. Và sửa nó trong repo thì production cũng thành
# noindex, vì hai môi trường dùng chung một cây mã.
#
# Một header response thì không git-reset được. Đó là lý do duy nhất.
#
# Nhớ: `X-Robots-Tag` là lệnh cho công cụ tìm kiếm, KHÔNG phải một tầng bảo
# mật. Nó không chặn ai mở trang. Dev vẫn phải có dữ liệu đã tẩy
# (`php artisan oohx:tay-du-lieu-dev`) và `OOHX_TRIAL_MODE=true`.
#
# ══════════════════════════════════════════════════════════════════════════
# ĐO NGÀY 07/11/2026: [A] là lớp DUY NHẤT, [B] KHÔNG HOẠT ĐỘNG
# ══════════════════════════════════════════════════════════════════════════
#
# Khối [B] đã được dán vào `detail/dev.oohx.net.conf` ngay sau `docRoot`, ở cấp
# ngoài cùng, rồi `lswsctrl restart`. OpenLiteSpeed không báo lỗi gì, và
# `X-Robots-Tag` KHÔNG xuất hiện — không trên `/`, không trên `/explore`.
#
# Lý do sâu hơn cú pháp: cả hai đường đều đi qua `context` reverse proxy sang
# Next.js, nên phản hồi mang header của backend. `extraHeaders` ở cấp vhost
# không chạm được vào chúng. Và 13 context ấy do `oohx-sync-proxy` sinh ra rồi
# ghi đè ở mỗi lượt deploy, nên dán `extraHeaders` vào trong context cũng
# không giữ được qua lượt deploy kế tiếp.
#
# Tức với kiến trúc proxy này, vhost KHÔNG phải chỗ đặt được noindex.
# Cloudflare không phải "lớp chính" — nó là lớp duy nhất.
#
# Khối [B] giữ lại dưới đây làm ghi chép, KHÔNG phải để dán. Nếu một ngày
# dev phục vụ trang tĩnh thẳng từ OpenLiteSpeed (không qua proxy) thì nó mới
# có tác dụng, và khi đó vẫn phải kiểm bằng `curl -sI`, không tin vào việc
# "đã dán rồi".
#
# ══════════════════════════════════════════════════════════════════════════
# [A] Cloudflare — Transform Rule, lớp DUY NHẤT
# ══════════════════════════════════════════════════════════════════════════
#
# Triển khai 07/11/2026. Biểu thức bộ lọc, gõ thẳng qua "Edit expression":
#
#   (http.host eq "dev.oohx.net") or (http.host eq "dev-dash.oohx.net")
#
# Hành động: Set static — KHÔNG phải "Add static". `Set` ghi đè nếu backend đã
# trả header cùng tên; `Add` thêm một dòng thứ hai bên cạnh.
#
# Đo sau khi triển khai:
#
#   dev.oohx.net/                      X-Robots-Tag: noindex, nofollow
#   dev.oohx.net/explore               X-Robots-Tag: noindex, nofollow
#   dev-dash.oohx.net/admin/login      X-Robots-Tag: noindex, nofollow
#   oohx.net/ · /explore · dash/admin/login      0 dòng
#
# Đường `/explore` là đường quan trọng nhất trong bốn: nó đi qua proxy, tức
# đúng chỗ mà [B] không với tới.
#
# Rules → Transform Rules → Modify Response Header → Create rule
#
#   Tên        : dev noindex
#   Điều kiện  : Hostname  equals  dev.oohx.net
#                (thêm OR Hostname equals dev-dash.oohx.net)
#   Hành động  : Set static
#                Header name  : X-Robots-Tag
#                Value        : noindex, nofollow
#
# Vì sao lớp này là chính, không phải phụ:
#
#   · Nó ở ngoài máy chủ, nên không một lượt deploy, một lần `lswsctrl
#     restart`, hay một lần aaPanel ghi lại vhost nào xoá được nó.
#   · Người gõ đã mở đúng dashboard đó ở bước 1 và 2 của lát 4 — hai bản ghi
#     DNS và một Cache Rule. Thêm rule này là cùng một lượt việc.
#   · Bot chỉ tới được dev QUA Cloudflare: IP gốc không công bố ở đâu cả. Nên
#     một header dán ở biên là đủ phủ mọi đường mà bot thật đi.
#
# ══════════════════════════════════════════════════════════════════════════
# [B] OpenLiteSpeed — vhost của dev. ĐÃ THỬ, KHÔNG HOẠT ĐỘNG
# ══════════════════════════════════════════════════════════════════════════
#
# Giữ lại làm ghi chép. Đây là khối đã dán vào
# `/www/server/panel/vhost/openlitespeed/detail/dev.oohx.net.conf`, ở cấp ngoài
# cùng (ngang với `docRoot`), không lồng trong `context` nào — và header vẫn
# không xuất hiện, vì mọi đường của dev đều đi qua proxy. Xem mục đầu tệp.

extraHeaders  <<<END_extraHeaders
Header set X-Robots-Tag "noindex, nofollow"
END_extraHeaders

# rồi `/usr/local/lsws/bin/lswsctrl restart`.
#
# Hai điều phải biết về khối này:
#
#   1. **Đã chạy nó trên máy chủ ngày 07/11/2026, và nó không có tác dụng.**
#      Bản đầu của tệp này đoán rằng rủi ro là "`extraHeaders` sai cú pháp làm
#      OpenLiteSpeed bỏ qua khối đó — không phải lỗi khi khởi động, chỉ là
#      header không bao giờ xuất hiện". Triệu chứng đúng y như đoán; nguyên
#      nhân thì khác và nặng hơn: phản hồi đi qua reverse proxy mang header của
#      backend, nên `extraHeaders` ở cấp vhost không chạm tới được. Sửa cú pháp
#      cũng không cứu được. Xem mục đầu tệp.
#   2. aaPanel có thể ghi lại tệp `detail/*.conf` khi người dùng bấm đổi gì đó
#      trong giao diện site. Khối này không nằm trong vùng `oohx-sync-proxy`
#      quản (script chỉ chạm `proxy/<site>/`), nên script không xoá nó — nhưng
#      aaPanel thì có thể. Đó là lý do thứ hai để [A] là lớp chính.
#
# ══════════════════════════════════════════════════════════════════════════
# Kiểm — chạy từ máy bất kỳ, sau khi dev.oohx.net đã sống
# ══════════════════════════════════════════════════════════════════════════
#
#   curl -sI https://dev.oohx.net/ | grep -i x-robots-tag
#   curl -sI https://dev.oohx.net/explore | grep -i x-robots-tag
#
# Phải in `x-robots-tag: noindex, nofollow` ở CẢ HAI. Đường thứ hai đi qua
# proxy sang Next.js, đường thứ nhất không — một header khai ở tầng ngoài có
# thể phủ đường này mà không phủ đường kia, và trang công khai nằm ở đường thứ
# hai.
#
# Và kiểm rằng production KHÔNG bị lây:
#
#   curl -sI https://oohx.net/ | grep -ci x-robots-tag     # phải in 0
